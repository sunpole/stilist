<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">

        <!-- Open Graph -->
        <meta property="og:title" content="⚡ NEON PASS 2026 — генератор безопасных паролей">
        <meta property="og:description" content="Современный неоновый генератор с уникальными алгоритмами и военным стилем">
        <meta property="og:image" content="https://github.com/sunpole/stilist/raw/main/pass/Screenshot.jpg">
        <meta property="og:url" content="https://sunpole.github.io/stilist/pass/">
        <meta property="og:type" content="website">
        <meta property="og:site_name" content="NEON PASS 2026">
        
        <!-- Twitter Card -->
        <meta name="twitter:card" content="summary_large_image">
        <meta name="twitter:title" content="⚡ NEON PASS 2026">
        <meta name="twitter:description" content="Генератор паролей в неоновом стиле">
        <meta name="twitter:image" content="https://github.com/sunpole/stilist/raw/main/pass/Screenshot.jpg">
    
    <title>⚡ NEON PASS 2026</title>
    <style>
        /* ===== СБРОС И ТЕМНАЯ ТЕМА ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #0a0c10;
            --surface: #14181c;
            --surface-light: #1e2429;
            --text: #e0e0e0;
            --text-dim: #a0a8b0;
            --neon-blue: #00f0ff;
            --neon-green: #00ff9d;
            --neon-red: #ff3b6f;
            --neon-cyan: #0ff;
            --neon-purple: #b388ff;
            --border-dim: #2a323a;
            --glow: 0 0 10px rgba(0, 240, 255, 0.5);
            --glow-green: 0 0 10px rgba(0, 255, 157, 0.5);
            --glow-red: 0 0 10px rgba(255, 59, 111, 0.5);
            --radius: 20px;
            --radius-sm: 14px;
            --transition: 0.15s ease;
        }

        body {
            font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            line-height: 1.4;
            -webkit-tap-highlight-color: transparent;
            text-rendering: optimizeLegibility;
        }

        .generator {
            max-width: 860px;
            width: 100%;
            background: var(--surface);
            border-radius: var(--radius);
            padding: 28px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8), 0 0 0 1px var(--neon-blue) inset, 0 0 20px rgba(0, 240, 255, 0.3);
            backdrop-filter: blur(4px);
        }

        /* ===== ШАПКА ===== */
        .header {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 28px;
            border-bottom: 1px solid var(--neon-blue);
            padding-bottom: 16px;
        }

        .title {
            font-weight: 700;
            font-size: 1.8rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-shadow: 0 0 8px var(--neon-blue);
            color: var(--neon-cyan);
        }

        .length-control {
            display: flex;
            align-items: center;
            gap: 12px;
            background: var(--surface-light);
            padding: 6px 16px;
            border-radius: 40px;
            border: 1px solid var(--neon-blue);
            box-shadow: var(--glow);
        }

        .length-control label {
            font-weight: 500;
            color: var(--neon-cyan);
            text-transform: uppercase;
            font-size: 0.9rem;
        }

        .length-control input {
            width: 80px;
            padding: 8px 12px;
            border: 2px solid var(--border-dim);
            border-radius: 30px;
            font-size: 1.3rem;
            font-weight: 600;
            text-align: center;
            background: var(--bg);
            color: var(--neon-green);
            outline: none;
            transition: var(--transition);
            box-shadow: 0 0 5px var(--neon-green);
        }

        .length-control input:focus {
            border-color: var(--neon-green);
            box-shadow: 0 0 15px var(--neon-green);
        }

        .minimum-panel {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 24px;
            padding: 12px 14px;
            background: rgba(0, 0, 0, 0.24);
            border: 1px solid var(--border-dim);
            border-radius: var(--radius-sm);
        }

        .minimum-mode-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            flex: 0 0 auto;
            min-height: 40px;
            padding: 8px 12px;
            border: 1px solid var(--border-dim);
            border-radius: 8px;
            background: var(--bg);
            color: var(--text-dim);
            font: inherit;
            font-size: 0.76rem;
            font-weight: 800;
            letter-spacing: 1px;
            cursor: pointer;
        }

        .minimum-mode-btn.active {
            color: var(--neon-green);
            border-color: var(--neon-green);
            box-shadow: 0 0 12px rgba(0, 255, 157, 0.35);
        }

        .minimum-badge {
            display: grid;
            place-items: center;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: currentColor;
            color: var(--bg);
            font-size: 0.75rem;
        }

        .minimum-icons {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .minimum-icon-btn {
            display: grid;
            place-items: center;
            width: 36px;
            height: 36px;
            padding: 0;
            border: 1px solid var(--border-dim);
            border-radius: 50%;
            background: var(--bg);
            font-size: 1.15rem;
            cursor: pointer;
            opacity: 0.45;
            transition: var(--transition);
        }

        .minimum-icon-btn.selected {
            opacity: 1;
            border-color: var(--neon-green);
            box-shadow: 0 0 12px rgba(0, 255, 157, 0.42);
        }

        .minimum-icon-btn:disabled {
            cursor: not-allowed;
            opacity: 0.18;
            box-shadow: none;
        }

        /* ===== СЕТКА КАТЕГОРИЙ ===== */
        .categories-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 20px;
            margin-bottom: 32px;
        }

        .category-card {
            background: var(--surface-light);
            border-radius: var(--radius-sm);
            padding: 18px 12px 12px;
            border: 1px solid var(--border-dim);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            transition: var(--transition);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.6);
            position: relative;
        }

        .category-card.active {
            border-color: var(--neon-blue);
            box-shadow: var(--glow), 0 4px 15px rgba(0, 240, 255, 0.3);
        }

        /* Иконка-кнопка включения */
        .icon-toggle {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: var(--bg);
            border: 2px solid var(--border-dim);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 10px;
            font-size: 2.4rem;
            cursor: pointer;
            transition: var(--transition);
            user-select: none;
            box-shadow: 0 0 0 0 transparent;
        }

        .category-card.active .icon-toggle {
            border-color: var(--neon-blue);
            background: var(--surface);
            color: var(--neon-cyan);
            box-shadow: 0 0 20px var(--neon-blue);
            transform: scale(1.02);
        }

        .icon-toggle:active {
            transform: scale(0.94);
        }

        /* Контейнер для названия и счётчика */
        .cat-info {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 0, 0, 0.3);
            padding: 6px 10px;
            border-radius: 30px;
            margin-bottom: 10px;
            border: 1px solid var(--border-dim);
        }

        .cat-label {
            font-weight: 600;
            font-size: 0.7rem;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .cat-counter {
            font-weight: 700;
            font-size: 1rem;
            color: var(--neon-green);
            text-shadow: 0 0 5px var(--neon-green);
            background: var(--bg);
            padding: 2px 8px;
            border-radius: 20px;
            border: 1px solid var(--neon-green);
            min-width: 30px;
            text-align: center;
        }

        /* Бусты */
        .boosts {
            display: flex;
            gap: 8px;
            width: 100%;
            justify-content: center;
            margin-top: 4px;
        }

        .boost-btn {
            flex: 1;
            padding: 8px 0;
            border: none;
            border-radius: 30px;
            font-weight: 800;
            font-size: 0.75rem;
            letter-spacing: 1px;
            cursor: pointer;
            transition: var(--transition);
            text-transform: uppercase;
            color: #000;
            background: var(--surface);
            border: 1px solid;
            box-shadow: 0 2px 8px rgba(0,0,0,0.6);
            font-weight: 900;
        }

        .boost-btn.red {
            border-color: var(--neon-red);
            color: var(--neon-red);
            text-shadow: 0 0 5px var(--neon-red);
        }
        .boost-btn.red.active {
            background: var(--neon-red);
            color: #000;
            box-shadow: 0 0 20px var(--neon-red);
            border-color: var(--neon-red);
        }
        .boost-btn.green {
            border-color: var(--neon-green);
            color: var(--neon-green);
            text-shadow: 0 0 5px var(--neon-green);
        }
        .boost-btn.green.active {
            background: var(--neon-green);
            color: #000;
            box-shadow: 0 0 20px var(--neon-green);
            border-color: var(--neon-green);
        }
        .boost-btn:active {
            transform: scale(0.94);
        }

        /* ===== ПОЛЕ ПАРОЛЯ И КНОПКИ ===== */
        .result-area {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-top: 24px;
        }

        .password-field-wrapper {
            display: flex;
            align-items: center;
            background: var(--bg);
            border-radius: 60px;
            border: 2px solid var(--neon-blue);
            padding: 4px 4px 4px 24px;
            box-shadow: var(--glow), 0 0 30px rgba(0,240,255,0.2);
        }

        .password-field-wrapper input {
            flex: 1;
            border: none;
            background: transparent;
            font-size: 1.4rem;
            font-family: 'Fira Code', 'SF Mono', monospace;
            padding: 16px 0;
            outline: none;
            color: var(--neon-green);
            text-shadow: 0 0 6px var(--neon-green);
            letter-spacing: 1px;
            width: 100%;
        }

        .action-buttons {
            display: flex;
            gap: 14px;
            justify-content: flex-end;
        }

        .action-btn {
            border: none;
            color: #000;
            font-size: 1.2rem;
            padding: 14px 28px;
            border-radius: 50px;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 10px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            background: var(--surface-light);
            border: 1px solid;
            box-shadow: 0 6px 0 rgba(0,0,0,0.6);
        }

        .action-btn.regenerate-btn {
            border-color: var(--neon-purple);
            color: var(--neon-purple);
            text-shadow: 0 0 6px var(--neon-purple);
        }
        .action-btn.regenerate-btn:active {
            transform: translateY(3px);
            box-shadow: 0 3px 0 #000;
        }

        .action-btn.copy-btn {
            border-color: var(--neon-blue);
            color: var(--neon-blue);
            text-shadow: 0 0 6px var(--neon-blue);
        }
        .action-btn.copy-btn:active {
            transform: translateY(3px);
            box-shadow: 0 3px 0 #000;
        }

        /* ===== ТОСТ ===== */
        .toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--surface-light);
            color: var(--neon-cyan);
            padding: 14px 32px;
            border-radius: 40px;
            font-weight: 600;
            box-shadow: 0 0 30px var(--neon-blue), 0 0 0 1px var(--neon-blue);
            border: 1px solid var(--neon-cyan);
            opacity: 0;
            transition: 0.2s;
            pointer-events: none;
            z-index: 999;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .toast.show {
            opacity: 1;
        }

        /* ===== АДАПТАЦИЯ ===== */
        @media (max-width: 700px) {
            .generator {
                padding: 20px;
            }
            .categories-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 14px;
            }
            .icon-toggle {
                width: 56px;
                height: 56px;
                font-size: 2rem;
            }
            .cat-info {
                padding: 4px 8px;
            }
            .action-buttons {
                flex-direction: column;
                gap: 10px;
            }
            .action-btn {
                justify-content: center;
                width: 100%;
            }
        }

        @media (max-width: 450px) {
            .categories-grid {
                grid-template-columns: 1fr;
            }
            .title {
                font-size: 1.4rem;
            }
            .length-control {
                width: 100%;
            }

            .minimum-panel {
                align-items: flex-start;
                flex-direction: column;
            }
        }

        /* Стили для счетчиков */
        .category-card .cat-counter {
            transition: 0.1s;
        }
    </style>
</head>
<body>
    <div class="generator">
        <div class="header">
            <span class="title">⚡ NEON SECURE 2026</span>
            <div class="length-control">
                <label for="length">длина</label>
                <input type="number" id="length" min="1" max="999" value="24" step="1">
            </div>
        </div>

        <section class="minimum-panel" aria-label="Минимум один символ из выбранных категорий">
            <button class="minimum-mode-btn active" id="minimumModeBtn" type="button" aria-pressed="true" title="Включить или выключить обязательные символы">
                <span class="minimum-badge">1</span>
                <span>МИНИМУМ 1</span>
            </button>
            <div class="minimum-icons" id="minimumCategories" aria-label="Категории с обязательным символом"></div>
        </section>

        <!-- Категории -->
        <div class="categories-grid" id="categoriesContainer"></div>

        <!-- Результат -->
        <div class="result-area">
            <div class="password-field-wrapper">
                <input type="text" id="passwordOutput" readonly value="" placeholder="сгенерированный пароль">
            </div>
            <div class="action-buttons">
                <button class="action-btn regenerate-btn" id="regenerateBtn">
                    <span>⟳</span> перезапуск
                </button>
                <button class="action-btn copy-btn" id="copyBtn">
                    <span>📋</span> копировать
                </button>
                <button class="action-btn regenerate-btn" id="clearBtn" type="button" title="Очистить пароль и данные генератора">
                    <span>⌫</span> очистить
                </button>
            </div>
        </div>
    </div>

    <div class="toast" id="toast">Скопировано</div>

    <script>
        (function() {
            // ===== НАБОРЫ СИМВОЛОВ =====
            const CHAR_SETS = {
                latUpper: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split(''),
                latLower: 'abcdefghijklmnopqrstuvwxyz'.split(''),
                cyrUpper: 'АБВГДЕЁЖЗИЙКЛМНОПРСТУФХЦЧШЩЪЫЬЭЮЯ'.split(''),
                cyrLower: 'абвгдеёжзийклмнопрстуфхцчшщъыьэюя'.split(''),
                digits: '0123456789'.split(''),
                simpleSpecial: '!"№;%:?*()_+'.split(''),
                extraSpecial: '@#$^&*[]{}<>\\|/'.split('')
            };

            // Категории с иконками, кириллица по умолчанию выключена
            const categories = [
                { id: 'latUpper', name: 'ЗАГЛ ЛАТ', icon: '🔠', set: CHAR_SETS.latUpper, active: true },
                { id: 'latLower', name: 'ПРОП ЛАТ', icon: '🔡', set: CHAR_SETS.latLower, active: true },
                { id: 'cyrUpper', name: 'ЗАГЛ КИР', icon: '🔤', set: CHAR_SETS.cyrUpper, active: false },
                { id: 'cyrLower', name: 'ПРОП КИР', icon: '📝', set: CHAR_SETS.cyrLower, active: false },
                { id: 'digits', name: 'ЦИФРЫ', icon: '🔢', set: CHAR_SETS.digits, active: true },
                { id: 'simpleSpecial', name: 'ПРОСТЫЕ', icon: '#️⃣', set: CHAR_SETS.simpleSpecial, active: true },
                { id: 'extraSpecial', name: 'СЛОЖНЫЕ', icon: '🔣', set: CHAR_SETS.extraSpecial, active: true }
            ];

            // Состояние приложения
            let state = {
                length: 24,
                minimumMode: true,
                minimumCategoryIds: categories.filter(category => category.active).map(category => category.id),
                categories: categories.map(c => ({
                    ...c,
                    boost250: false,
                    boost500: false
                }))
            };

            // DOM элементы
            const container = document.getElementById('categoriesContainer');
            const lengthInput = document.getElementById('length');
            const passwordOutput = document.getElementById('passwordOutput');
            const copyBtn = document.getElementById('copyBtn');
            const regenerateBtn = document.getElementById('regenerateBtn');
            const clearBtn = document.getElementById('clearBtn');
            const minimumModeBtn = document.getElementById('minimumModeBtn');
            const minimumCategories = document.getElementById('minimumCategories');
            const toast = document.getElementById('toast');
            const CLIPBOARD_CLEAR_DELAY_MS = 60 * 1000;
            const STORAGE_PREFIX = 'neon-pass:';
            let clipboardClearTimer = null;

            // Тост
            function showToast(text, duration = 1500) {
                toast.textContent = text;
                toast.classList.add('show');
                setTimeout(() => toast.classList.remove('show'), duration);
            }

            // Проверка лимитов бустов
            function canActivateBoost(catIndex, color, currentState) {
                const cats = currentState.categories;
                if (color === 'red') {
                    const redCount = cats.filter(c => c.boost250).length;
                    if (!cats[catIndex].boost250 && redCount >= 2) {
                        showToast('⚠️ МАКС 2 КРАСНЫХ', 1000);
                        return false;
                    }
                } else if (color === 'green') {
                    const greenCount = cats.filter(c => c.boost500).length;
                    if (!cats[catIndex].boost500 && greenCount >= 1) {
                        showToast('⚠️ ТОЛЬКО 1 ЗЕЛЁНЫЙ', 1000);
                        return false;
                    }
                }
                return true;
            }

            // Рендер карточек
            function render() {
                let html = '';
                state.categories.forEach((cat, idx) => {
                    const activeClass = cat.active ? 'active' : '';
                    const redActive = cat.boost250 ? 'active' : '';
                    const greenActive = cat.boost500 ? 'active' : '';

                    html += `
                        <div class="category-card ${activeClass}" data-index="${idx}">
                            <div class="icon-toggle" data-action="toggleCat" data-index="${idx}">${cat.icon}</div>
                            <div class="cat-info">
                                <span class="cat-label">${cat.name}</span>
                                <span class="cat-counter" id="counter-${idx}">0</span>
                            </div>
                            <div class="boosts">
                                <button class="boost-btn red ${redActive}" data-action="boostRed" data-index="${idx}">250%</button>
                                <button class="boost-btn green ${greenActive}" data-action="boostGreen" data-index="${idx}">500%</button>
                            </div>
                        </div>
                    `;
                });
                container.innerHTML = html;

                // Обработчики
                document.querySelectorAll('[data-action="toggleCat"]').forEach(el => {
                    el.addEventListener('click', (e) => {
                        e.stopPropagation();
                        const index = el.dataset.index;
                        toggleCategory(parseInt(index));
                    });
                });

                document.querySelectorAll('[data-action="boostRed"]').forEach(el => {
                    el.addEventListener('click', (e) => {
                        e.stopPropagation();
                        const index = el.dataset.index;
                        toggleBoost(parseInt(index), 'red');
                    });
                });

                document.querySelectorAll('[data-action="boostGreen"]').forEach(el => {
                    el.addEventListener('click', (e) => {
                        e.stopPropagation();
                        const index = el.dataset.index;
                        toggleBoost(parseInt(index), 'green');
                    });
                });

                renderMinimumControls();
            }

            function renderMinimumControls() {
                minimumModeBtn.classList.toggle('active', state.minimumMode);
                minimumModeBtn.setAttribute('aria-pressed', String(state.minimumMode));

                minimumCategories.innerHTML = state.categories.map(category => {
                    const selected = state.minimumCategoryIds.includes(category.id);
                    const disabled = !state.minimumMode || !category.active;
                    const className = selected && !disabled ? 'selected' : '';
                    const label = `${category.name}: минимум один символ`;

                    return `
                        <button class="minimum-icon-btn ${className}" type="button"
                            data-minimum-category="${category.id}"
                            title="${label}" aria-label="${label}"
                            aria-pressed="${selected && !disabled}" ${disabled ? 'disabled' : ''}>
                            ${category.icon}
                        </button>
                    `;
                }).join('');

                minimumCategories.querySelectorAll('[data-minimum-category]').forEach(button => {
                    button.addEventListener('click', () => toggleMinimumCategory(button.dataset.minimumCategory));
                });
            }

            function requiredCategories() {
                if (!state.minimumMode) return [];
                const selected = new Set(state.minimumCategoryIds);
                return state.categories.filter(category => category.active && selected.has(category.id));
            }

            function toggleMinimumCategory(categoryId) {
                if (!state.minimumMode) return;

                if (state.minimumCategoryIds.includes(categoryId)) {
                    state.minimumCategoryIds = state.minimumCategoryIds.filter(id => id !== categoryId);
                } else {
                    state.minimumCategoryIds.push(categoryId);
                }

                renderMinimumControls();
                generatePassword();
            }

            // Переключение категории
            function toggleCategory(index) {
                const cat = state.categories[index];
                cat.active = !cat.active;
                if (!cat.active) {
                    cat.boost250 = false;
                    cat.boost500 = false;
                    state.minimumCategoryIds = state.minimumCategoryIds.filter(id => id !== cat.id);
                } else if (!state.minimumCategoryIds.includes(cat.id)) {
                    state.minimumCategoryIds.push(cat.id);
                }
                render();
                generatePassword();
            }

            // Переключение бустов
            function toggleBoost(index, color) {
                const cat = state.categories[index];
                if (!cat.active) return;

                if (color === 'red') {
                    if (cat.boost250) {
                        cat.boost250 = false;
                    } else {
                        if (!canActivateBoost(index, 'red', state)) return;
                        cat.boost250 = true;
                    }
                } else if (color === 'green') {
                    if (cat.boost500) {
                        cat.boost500 = false;
                    } else {
                        if (!canActivateBoost(index, 'green', state)) return;
                        state.categories.forEach((c, i) => {
                            if (i !== index) c.boost500 = false;
                        });
                        cat.boost500 = true;
                    }
                }
                render();
                generatePassword();
            }

            function secureRandomInt(maxExclusive) {
                if (!Number.isSafeInteger(maxExclusive) || maxExclusive <= 0) {
                    throw new Error('Invalid secure random range');
                }

                const range = 0x100000000;
                const limit = Math.floor(range / maxExclusive) * maxExclusive;
                const values = new Uint32Array(1);

                do {
                    crypto.getRandomValues(values);
                } while (values[0] >= limit);

                return values[0] % maxExclusive;
            }

            function secureShuffle(items) {
                for (let i = items.length - 1; i > 0; i--) {
                    const j = secureRandomInt(i + 1);
                    [items[i], items[j]] = [items[j], items[i]];
                }
                return items;
            }

            function ensureMinimumLength() {
                const minimum = Math.max(1, requiredCategories().length);
                lengthInput.min = minimum;

                if (state.length < minimum) {
                    state.length = minimum;
                    lengthInput.value = minimum;
                    showToast(`ДЛИНА УВЕЛИЧЕНА ДО ${minimum}`, 1200);
                }
            }

            // Each selected minimum category receives one character first.
            // Remaining positions are selected with cryptographic randomness and boosts.
            function distributeLength() {
                const activeCats = state.categories.filter(c => c.active);
                if (activeCats.length === 0) return new Array(state.categories.length).fill(0);

                ensureMinimumLength();
                const L = state.length;
                const required = requiredCategories();
                const weights = activeCats.map(c => {
                    if (c.boost500) return 10;
                    if (c.boost250) return 5;
                    return 2;
                });
                const totalWeight = weights.reduce((sum, weight) => sum + weight, 0);
                const result = new Array(state.categories.length).fill(0);

                state.categories.forEach((cat, idx) => {
                    if (required.includes(cat)) {
                        result[idx] = 1;
                    }
                });

                for (let position = required.length; position < L; position++) {
                    let roll = secureRandomInt(totalWeight);
                    let selected = 0;

                    for (let index = 0; index < weights.length; index++) {
                        roll -= weights[index];
                        if (roll < 0) {
                            selected = index;
                            break;
                        }
                    }

                    const categoryIndex = state.categories.indexOf(activeCats[selected]);
                    result[categoryIndex] += 1;
                }

                return result;
            }

            // Обновление счётчиков на карточках
            function updateCounters(distribution) {
                distribution.forEach((count, idx) => {
                    const counterEl = document.getElementById(`counter-${idx}`);
                    if (counterEl) counterEl.textContent = count;
                });
            }

            // Генерация пароля
            function generatePassword() {
                const distribution = distributeLength();
                const totalLength = distribution.reduce((a, b) => a + b, 0);
                if (totalLength === 0) {
                    passwordOutput.value = '';
                    updateCounters(distribution);
                    return;
                }

                // Построение порядка категорий
                let order = [];
                distribution.forEach((count, catIdx) => {
                    for (let i = 0; i < count; i++) order.push(catIdx);
                });
                secureShuffle(order);

                const maxFreq = Math.max(1, Math.floor(state.length * 3 / 24));
                const charCount = new Map();
                let lastChar = '', secondLast = '';
                const passwordChars = [];

                for (let pos = 0; pos < order.length; pos++) {
                    const catIdx = order[pos];
                    const category = state.categories[catIdx];
                    const charSet = category.set;

                    if (charSet.length === 0) {
                        passwordChars.push('?');
                        continue;
                    }

                    const candidates = [
                        charSet.filter(candidate => candidate !== lastChar
                            && candidate !== secondLast
                            && (charCount.get(candidate) || 0) < maxFreq),
                        charSet.filter(candidate => candidate !== lastChar
                            && (charCount.get(candidate) || 0) < maxFreq),
                        charSet.filter(candidate => (charCount.get(candidate) || 0) < maxFreq),
                        charSet
                    ];
                    const available = candidates.find(group => group.length > 0);
                    const chosen = available[secureRandomInt(available.length)];

                    passwordChars.push(chosen);
                    charCount.set(chosen, (charCount.get(chosen) || 0) + 1);
                    secondLast = lastChar;
                    lastChar = chosen;
                }

                passwordOutput.value = passwordChars.join('');
                updateCounters(distribution);
            }

            function clearGeneratorStorage() {
                try {
                    for (let index = localStorage.length - 1; index >= 0; index--) {
                        const key = localStorage.key(index);
                        if (key && key.startsWith(STORAGE_PREFIX)) localStorage.removeItem(key);
                    }

                    for (let index = sessionStorage.length - 1; index >= 0; index--) {
                        const key = sessionStorage.key(index);
                        if (key && key.startsWith(STORAGE_PREFIX)) sessionStorage.removeItem(key);
                    }
                } catch (_) {
                    // Some browser privacy modes disable web storage entirely.
                }

                if ('caches' in window) {
                    caches.keys()
                        .then(keys => Promise.all(
                            keys
                                .filter(key => key.startsWith(STORAGE_PREFIX))
                                .map(key => caches.delete(key))
                        ))
                        .catch(() => {});
                }
            }

            function clearVisiblePassword() {
                passwordOutput.value = '';
                clearGeneratorStorage();
            }

            function scheduleClipboardClear() {
                clearTimeout(clipboardClearTimer);
                clipboardClearTimer = window.setTimeout(() => {
                    navigator.clipboard.writeText('').catch(() => {});
                }, CLIPBOARD_CLEAR_DELAY_MS);
            }

            // The generated password leaves the page immediately after copying.
            // Clipboard cleanup is attempted after one minute when the browser allows it.
            copyBtn.addEventListener('click', () => {
                if (!passwordOutput.value) return;
                const password = passwordOutput.value;
                navigator.clipboard.writeText(password).then(() => {
                    clearVisiblePassword();
                    scheduleClipboardClear();
                    showToast('✅ СКОПИРОВАНО · ПОЛЕ ОЧИЩЕНО');
                }).catch(() => {
                    passwordOutput.select();
                    document.execCommand('copy');
                    clearVisiblePassword();
                    showToast('✅ СКОПИРОВАНО · ПОЛЕ ОЧИЩЕНО');
                });
            });

            clearBtn.addEventListener('click', () => {
                clearTimeout(clipboardClearTimer);
                clearVisiblePassword();
                showToast('⌫ ПАРОЛЬ ОЧИЩЕН');
            });

            minimumModeBtn.addEventListener('click', () => {
                state.minimumMode = !state.minimumMode;
                ensureMinimumLength();
                renderMinimumControls();
                generatePassword();
            });

            // Перегенерация (с "очисткой кеша" через новый вызов)
            regenerateBtn.addEventListener('click', () => {
                generatePassword();
                showToast('🔄 ПЕРЕГЕНЕРИРОВАНО', 1000);
            });

            // Изменение длины
            lengthInput.addEventListener('input', (e) => {
                let val = parseInt(e.target.value, 10);
                const minimum = Math.max(1, requiredCategories().length);
                if (isNaN(val) || val < minimum) val = minimum;
                if (val > 999) val = 999;
                state.length = val;
                lengthInput.value = val;
                generatePassword();
            });

            window.addEventListener('pagehide', clearVisiblePassword);

            // Инициализация
            render();
            ensureMinimumLength();
            generatePassword();
        })();
    </script>
</body>
</html>
